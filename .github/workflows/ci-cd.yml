# Lab 1 target: GitHub Actions CI/CD pipeline
#
# Demonstrates: pipeline-as-code, dependency caching, test artifacts,
# container build/push to GHCR, and progressive deployment gated by
# GitHub Environments (staging auto-deploys, production requires manual
# approval configured on the "production" Environment's protection rules).
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/sample-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/sample-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: examples/sample-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: examples/sample-app/coverage

  build-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: examples/sample-app
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-staging:
    needs: build-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Deploying ${{ env.IMAGE_NAME }}:${{ github.sha }} to staging (kubectl/helm goes here)"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # configure required reviewers on this Environment for a manual approval gate
    steps:
      - run: echo "Deploying ${{ env.IMAGE_NAME }}:${{ github.sha }} to production"

